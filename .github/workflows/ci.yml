name: CI
permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.github/CODEOWNERS'

jobs:
  shell:
    name: Shell compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Test installer and launcher with system Bash
        run: bash tests/installer-shell.sh
      - name: Test installer and launcher with Bash 3.2
        run: docker run --rm --network none --mount "type=bind,src=$PWD,dst=/repo,readonly" bash:3.2 /repo/tests/installer-shell.sh

  test:
    name: PHP ${{ matrix.php-version }} - ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        deps: ['highest']
        include:
          # Test lowest dependencies on PHP 8.1
          - php-version: '8.1'
            deps: 'lowest'
          # Coverage only on latest PHP with highest deps
          - php-version: '8.5'
            deps: 'highest'
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, dom, filter, json, gd, mysqli
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client fish zsh bash-completion

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.deps }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.deps }}-composer-

      - name: Verify lock file installs on PHP 8.1
        if: matrix.php-version == '8.1' && matrix.deps == 'highest'
        run: composer install --dry-run --prefer-dist --no-progress --no-interaction

      - name: Install dependencies (lowest)
        if: matrix.deps == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-progress --no-interaction

      - name: Install dependencies (highest)
        if: matrix.deps == 'highest'
        run: composer update --prefer-stable --no-progress --no-interaction

      - name: Show installed versions
        run: composer show --direct

      - name: Run PHPUnit tests
        run: composer test

      - name: Run PHPUnit with coverage
        if: matrix.coverage
        run: composer coverage

      - name: Upload coverage to Codecov
        if: matrix.coverage && !env.ACT
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: build/coverage/clover.xml
          disable_search: true
          fail_ci_if_error: true

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, dom, filter, json, gd, mysqli
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client fish zsh bash-completion

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Install Git hooks
        run: composer prepare

      - name: Run all repository checks
        run: pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  server-weights-mariadb:
    name: MariaDB integration
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kvs_test
          MARIADB_USER: kvs_user
          MARIADB_PASSWORD: kvs_pass
        ports:
          - 13308:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run MariaDB storage weight contract
        env:
          KVS_CLI_TEST_SERVER_WEIGHTS_MARIADB: '1'
          KVS_TEST_DB_HOST: 127.0.0.1
          KVS_TEST_DB_PORT: '13308'
          KVS_TEST_DB_USER: kvs_user
          KVS_TEST_DB_PASS: kvs_pass
          KVS_TEST_DB_NAME: kvs_test
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/ServerWeightMariaDbIntegrationTest.php

      - name: Run MariaDB queue retry contract
        env:
          KVS_CLI_TEST_QUEUE_MARIADB: '1'
          KVS_TEST_DB_HOST: 127.0.0.1
          KVS_TEST_DB_PORT: '13308'
          KVS_TEST_DB_USER: kvs_user
          KVS_TEST_DB_PASS: kvs_pass
          KVS_TEST_DB_NAME: kvs_test
        run: vendor/bin/phpunit --configuration phpunit.xml.dist tests/QueueRetryMariaDbIntegrationTest.php

      - name: Run MariaDB migration scan contract
        env:
          KVS_CLI_TEST_SCAN_MARIADB: '1'
          KVS_TEST_DB_HOST: 127.0.0.1
          KVS_TEST_DB_PORT: '13308'
          KVS_TEST_DB_USER: kvs_user
          KVS_TEST_DB_PASS: kvs_pass
          KVS_TEST_DB_NAME: kvs_test
        run: >-
          vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage
          --fail-on-warning --fail-on-risky --fail-on-deprecation tests/ScanCommandTest.php

  build:
    name: Build PHAR
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [test, lint, server-weights-mariadb, shell]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, phar
          coverage: none
          tools: composer:v2
          ini-values: phar.readonly=0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.1-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.1-composer-

      - name: Install dependencies (no dev)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Set dev version
        if: github.ref == 'refs/heads/dev'
        run: |
          BASE_VERSION=$(tr -d '\n' < VERSION | sed 's/-beta$//')
          echo "${BASE_VERSION}-dev-${GITHUB_SHA::7}" > VERSION
          echo "Dev version: $(cat VERSION)"

      - name: Build PHAR
        run: php -d phar.readonly=0 build.php

      - name: Verify PHAR
        run: |
          ./kvs.phar --version
          bash -n bin/kvs-docker
          bash -n install.sh
          cp bin/kvs-docker kvs-docker

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: kvs-cli-phar
          path: |
            kvs.phar
            kvs-docker
            install.sh
          retention-days: 30
          compression-level: 9
